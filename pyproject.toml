[project]
name = "telegram-mcp"
version = "0.1.10"
description = "Read-only Telegram MCP gateway; development foundation"
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.11.3",
    "cryptography==50.0.1",
    "jsonschema[format]==4.26.0",
    "keyring==25.7.0",
    "mcp==2.2.0",
    "mcp-types==2.2.0",
    "pydantic>=2.12,<3",
    "python-ulid==4.0.1",
    "sqlcipher3==0.6.2",
    "starlette==1.6.0",
    "telethon==1.45.0",
    "uvicorn==0.53.0",
]

[project.scripts]
telegram-mcp = "comms.transports.telegram.cli:main"
comms = "comms.transports.telegram.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "platform_gated: mutates or interrogates the host; needs --run-platform-gated",
    "telegram_testdc: talks to Telegram's test servers; needs --run-telegram-testdc",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
# Explicit package bases keep mypy's module resolution unambiguous for tests.
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlcipher3.*"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/comms", "src/telegram_mcp", "transports/whatsapp/src/whatsvault"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build==1.6.1",
    "hatchling==1.32.4",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]
