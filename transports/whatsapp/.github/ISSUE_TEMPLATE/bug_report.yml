name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Follow
        [SECURITY.md](../blob/main/SECURITY.md) instead.

        Please redact message content and phone numbers from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. whatsvault …
        2. …
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `whatsvault doctor`
      render: json
  - type: input
    id: versions
    attributes:
      label: macOS and Python versions
      placeholder: "macOS 15.2, Python 3.12.4"
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have removed all message content and phone numbers from this report
          required: true
        - label: This is not a security vulnerability
          required: true
