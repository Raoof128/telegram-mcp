name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations: { required: true }
  - type: textarea
    id: invariants
    attributes:
      label: Effect on the security invariants
      description: |
        Does this touch the MCP surface, the approval chain, key handling, the
        audit log, or the ingest ACK path? See SECURITY.md. "None" is a fine
        answer if it genuinely is.
    validations: { required: true }
